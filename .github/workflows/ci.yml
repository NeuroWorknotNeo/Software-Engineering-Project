name: CI

on:
  push:
  pull_request:

jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run app
        run: ./build/hello_app

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark
        run: |
          ./build/bench/hello_bench | tee bench.txt
          {
            echo '### Benchmark results'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
